# Local Postgres for development. Integration tests use <database>_test on the same server.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/labstash
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labstash
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
